# Override for the Playwright e2e suite against the fake providers. Web uses its own database
# (chess_e2e_test), which the suite's globalSetup creates, migrates and empties on every run, so
# the dev `chess` database is never touched. The qa container shares web's network namespace, so
# http://localhost:3100 (BETTER_AUTH_URL, and the links in the mails) is the app from inside it:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.e2e.yml docker compose -p <name> --profile e2e up -d web fakes
#   COMPOSE_FILE=docker-compose.yml:docker-compose.e2e.yml docker compose -p <name> --profile e2e --profile qa \
#     run --rm --no-deps qa sh -c "cd apps/web && node node_modules/@playwright/test/cli.js test --project e2e"
services:
  web:
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess_e2e_test
      # The browser runs in the qa container, which resolves the fakes service by name.
      LICHESS_AUTHORIZE_BASE_URL: http://fakes:3199
      LICHESS_API_BASE_URL: http://fakes:3199
      CHESSCOM_API_BASE_URL: http://fakes:3199/chesscom
      CHESSCOM_ENABLED: "1"
      # Sign-in is rate-limited per client address, which only a trusted proxy supplies
      # (ADR-WEB-3); without one every e2e user shares one bucket (3 links per 10 minutes). The qa
      # browser shares web's network namespace, so localhost is the "proxy", and
      # e2e/support/mail.ts sends each user's own x-forwarded-for.
      TRUSTED_PROXIES: 127.0.0.1/32,::1/128
      IP_ADDRESS_HEADERS: x-forwarded-for
      INVITE_ALLOWLIST: dev@example.invalid,adult@example.invalid,kid@example.invalid,games@example.invalid,reveal@example.invalid,rival@example.invalid,lichess@example.invalid,realtime@example.invalid,quality@example.invalid,quality-adult@example.invalid,cookies@example.invalid
    depends_on:
      fakes:
        condition: service_started
  qa:
    network_mode: "service:web"
    environment:
      E2E_BASE_URL: http://localhost:3100
      E2E_DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess_e2e_test
      MAILPIT_URL: http://mailpit:8025
      FAKES_URL: http://fakes:3199
