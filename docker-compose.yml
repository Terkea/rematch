name: chess-improver

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess
      DATABASE_URL_TEST: postgres://postgres:postgres@postgres:5432/chess_test
      WORKER_DATABASE_URL_TEST: postgres://postgres:postgres@postgres:5432/chess_worker_test
      REDIS_URL: redis://redis:6379
      STOCKFISH_PATH: /usr/local/bin/stockfish
      IN_DOCKER: "1"
      # Required, no default. Compose's `:?` is evaluated for the whole file (it would block rust-dev and
      # every `-p` project), so the worker itself fails fast on an empty value (requireEnv in src/main.ts, src/cli.ts).
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      # Keep Linux node_modules off the host checkout.
      # Each new workspace package needs its own node_modules volume (here and under volumes:).
      - node_modules:/app/node_modules
      - worker_node_modules:/app/apps/worker/node_modules
      - chess_core_node_modules:/app/packages/chess-core/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - pnpm_store:/pnpm-store

  rust-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    working_dir: /work/backend
    # Compose interpolates ${...} from the host shell and .env, NOT from `run -e`. So CARGO_TARGET_DIR
    # is derived inside the container from the LANE passed with `run -e LANE=<lane>` (default: main).
    entrypoint:
      - /bin/sh
      - -c
      - 'export CARGO_TARGET_DIR="/target/$${LANE:-main}"; exec "$$@"'
      - rust-dev
    environment:
      # Master connection for #[sqlx::test], which creates and drops one database per test.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess_test
      STOCKFISH_PATH: /usr/local/bin/stockfish
      IN_DOCKER: "1"
      # rust-dev makes no external API calls (tests use recorded fixtures), so a placeholder is safe.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-dev@example.invalid}
      RUST_LOG: warn
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/work
      - rust_target:/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git

volumes:
  pgdata:
  node_modules:
  worker_node_modules:
  chess_core_node_modules:
  db_node_modules:
  pnpm_store:
  rust_target:
  cargo_registry:
  cargo_git:
