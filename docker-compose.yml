name: chess-improver

# Every service that runs workspace code mounts the repo plus one node_modules volume per workspace
# package (Linux node_modules stay off the host checkout). Each new workspace package needs its own
# volume here and under volumes:.
x-workspace-volumes: &workspace-volumes
  - .:/app
  - node_modules:/app/node_modules
  - worker_node_modules:/app/apps/worker/node_modules
  - web_node_modules:/app/apps/web/node_modules
  - web_next:/app/apps/web/.next
  - chess_core_node_modules:/app/packages/chess-core/node_modules
  - db_node_modules:/app/packages/db/node_modules
  - ui_node_modules:/app/packages/ui/node_modules
  - ai_sidecar_node_modules:/app/services/ai-sidecar/node_modules
  - site_node_modules:/app/site/node_modules
  - pnpm_store:/pnpm-store

x-web-environment: &web-environment
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess
  WEB_DATABASE_URL_TEST: postgres://postgres:postgres@postgres:5432/chess_web_test
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-do-not-use-outside-local-compose}
  # The address the browser uses, so it follows WEB_PORT (docker-compose.ports.yml).
  BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3100}
  BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:${WEB_PORT:-3100}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:-Rematch <no-reply@chess-improver.local>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  LAB_ENABLED: "${LAB_ENABLED:-1}"
  # chess.com linking (ADR 0040: on in development); OAuth stays off until chess.com approves it.
  CHESSCOM_ENABLED: "${CHESSCOM_ENABLED:-1}"
  # Lichess sign-in and linking: off unless exactly "1" (this deployment is chess.com only).
  LICHESS_ENABLED: "${LICHESS_ENABLED:-0}"
  # Local only (ADR-FIX-N-1 Amendment 1): "1" treats an unverified account link as verified, so a
  # locally linked account sees its own report and coach. Off by default; production refuses it.
  ALLOW_UNVERIFIED_LINKS: "${ALLOW_UNVERIFIED_LINKS:-0}"
  CHESSCOM_OAUTH_ENABLED: ${CHESSCOM_OAUTH_ENABLED:-}
  CHESSCOM_CLIENT_ID: ${CHESSCOM_CLIENT_ID:-}
  CHESSCOM_CLIENT_SECRET: ${CHESSCOM_CLIENT_SECRET:-}
  # Private beta (ADR 0041, ADR-WEB-3): on unless exactly "0"; comma-separated invited emails.
  INVITE_ONLY: "${INVITE_ONLY:-1}"
  INVITE_ALLOWLIST: ${INVITE_ALLOWLIST:-}
  # Rate-limit client IP (ADR-WEB-3): forwarding headers are read only from these proxies (CIDRs).
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  IP_ADDRESS_HEADERS: ${IP_ADDRESS_HEADERS:-x-forwarded-for}
  IN_DOCKER: "1"
  SKIP_INSTALL: "1"
  # The AI plan (ADR 0075), the same variables as the Rust worker's: plan beta|free|pro, the
  # beta plan's coach messages per week, and its manual reports per UTC day (1 to 24).
  AI_DEFAULT_PLAN: ${AI_DEFAULT_PLAN:-beta}
  AI_BETA_CHAT_WEEKLY: ${AI_BETA_CHAT_WEEKLY:-100}
  AI_BETA_MANUAL_REPORTS_PER_DAY: ${AI_BETA_MANUAL_REPORTS_PER_DAY:-1}

services:
  postgres:
    image: postgres:17
    # ADR 0044: an init process as PID 1, so the postmaster is not the container's reaper. Without
    # it, an orphan such as a timed-out healthcheck's pg_isready is reparented to the postmaster,
    # and its exit code 2 reads as a crashed backend: every connection is killed and crash recovery
    # runs (tests see EOF, "connection reset", "in recovery mode").
    init: true
    # ADR 0066: one worker may hold pool_size + preview + 54 connections (R2 + R3 runners), so
    # the default 100 cannot fit a worker beside the web app, and parallel worker tests exhaust it.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Exec form, so there is no shell whose kill on timeout would orphan pg_isready. TCP
      # (-h 127.0.0.1), so it fails against the image's unix-socket-only init server and only passes
      # once the final server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "chess"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess
      DATABASE_URL_TEST: postgres://postgres:postgres@postgres:5432/chess_test
      WORKER_DATABASE_URL_TEST: postgres://postgres:postgres@postgres:5432/chess_worker_test
      WEB_DATABASE_URL_TEST: postgres://postgres:postgres@postgres:5432/chess_web_test
      REDIS_URL: redis://redis:6379
      STOCKFISH_PATH: /usr/local/bin/stockfish
      IN_DOCKER: "1"
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
      SKIP_INSTALL: "1"
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *workspace-volumes

  deps:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    working_dir: /app
    # One-shot install into the shared volumes. Services that depend on it set SKIP_INSTALL=1.
    command: ["true"]
    volumes: *workspace-volumes

  mailpit:
    image: axllent/mailpit:v1.34.0
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /app
    environment:
      <<: *web-environment
      # Docker bind mounts do not deliver file-change events to Linux.
      WATCHPACK_POLLING: "true"
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes: *workspace-volumes
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  fakes:
    profiles: [e2e]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    working_dir: /app
    command: ["pnpm", "--filter", "@ci/web", "exec", "tsx", "test/fakes/main.ts"]
    environment:
      SKIP_INSTALL: "1"
      PORT: "3199"
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes: *workspace-volumes

  qa:
    profiles: [qa]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    environment:
      <<: *web-environment
      BASE_URL: http://web:3100
    depends_on:
      deps:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    volumes: *workspace-volumes

  # R3 (ADR 0062): every interactive Claude call goes through this Agent SDK sidecar. No ports:
  # only the Rust backend on the compose network reaches it. Chat transcripts persist in Postgres
  # through the session store (role ai_sidecar); the CLI disk is a tmpfs scratch area.
  ai-sidecar:
    build:
      context: .
      dockerfile: services/ai-sidecar/Dockerfile
    environment:
      AI_SIDECAR_TOKEN: ${AI_SIDECAR_TOKEN:-dev-only-sidecar-token-change-me-0000000}
      AI_SIDECAR_ENV: ${AI_SIDECAR_ENV:-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # postgres://ai_sidecar:<password>@postgres:5432/chess. Empty = no session store (dev only).
      AI_SESSION_DATABASE_URL: ${AI_SESSION_DATABASE_URL:-}
    # Read-only root; the only writable paths are sized tmpfs scratch areas (they count toward
    # mem_limit). The CLI's config dir and cwd live in the first; /tmp is for the CLI's temp files.
    read_only: true
    tmpfs:
      - /var/lib/ai-sidecar:uid=1000,gid=1000,mode=0700,size=512m
      - /tmp:mode=1777,size=256m
    mem_limit: 5g

  # Dev only: grants the NOLOGIN ai_sidecar role LOGIN and AI_SIDECAR_DB_PASSWORD, after the
  # migrations ran. `docker compose --profile ai run --rm ai-sidecar-role` (ADR 0062).
  ai-sidecar-role:
    profiles: [ai]
    image: postgres:17
    entrypoint: ["sh", "/ai-sidecar-role.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: chess
      AI_SIDECAR_DB_PASSWORD: ${AI_SIDECAR_DB_PASSWORD:-}
    volumes:
      - ./docker/postgres/ai-sidecar-role.sh:/ai-sidecar-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  rust-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    working_dir: /work/backend
    # Compose interpolates ${...} from the host shell and .env, NOT from `run -e`. So the target dir
    # is derived inside the container from the LANE passed with `run -e LANE=<lane>` (default: main):
    # each lane builds into its own /target/<lane>. Cargo sees it through the fixed path /lane-target
    # (a symlink in the container's own filesystem), because sccache keys include the --out-dir,
    # -L and OUT_DIR paths: one path for every lane is what lets lanes hit each other's cache.
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p "/target/$${LANE:-main}" && ln -sfn "/target/$${LANE:-main}" /lane-target && export CARGO_TARGET_DIR=/lane-target; exec "$$@"'
      - rust-dev
    environment:
      # Master connection for #[sqlx::test], which creates and drops one database per test.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess_test
      STOCKFISH_PATH: /usr/local/bin/stockfish
      IN_DOCKER: "1"
      RUST_LOG: warn
      # R2 (ADR-R2-1): git-ignored data dir (Syzygy tables, never the Lichess dump) and Maia.
      DATA_DIR: /work/data
      SYZYGY_PATH: /work/data/syzygy
      MAIA_URL: ${MAIA_URL:-}
      # scripts/check-crate-age.sh caches crates.io publish dates here, shared by every lane.
      CRATE_AGE_CACHE: /crate-age
    depends_on:
      postgres:
        condition: service_healthy
    # rust_target stays per compose project (and per LANE inside it), so lanes never share a target
    # dir and `down -v` removes it. The four caches (cargo registry, cargo git, sccache, crates.io
    # publish dates) are external volumes shared by every project (ADR 0042), and `down -v` never
    # deletes external volumes. Create them once with `sh scripts/rust-cache-init.sh`. Compose
    # refuses to start rust-dev while one of them is missing.
    volumes:
      - .:/work
      - rust_target:/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - sccache:/sccache
      - crate_age:/crate-age
      # Syzygy tables live only in the main checkout (git-ignored). Gates run from a worktree set
      # SYZYGY_HOST_DIR to that folder, e.g. ../../data/syzygy from .worktrees/<name> (ADR-R2-12).
      - ${SYZYGY_HOST_DIR:-./data/syzygy}:/work/data/syzygy:ro

  # The Rust worker (Task 22): the runtime image of backend/Dockerfile. It reaches chess.com and
  # Lichess with the fixed project User-Agent and never sends an email (ADR 0043), so it gets no
  # CONTACT_EMAIL. No ports. On `docker compose stop` it drains within its 25 s grace.
  rust-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess
      STOCKFISH_PATH: /usr/local/bin/stockfish
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
      # Engines (and analyses at once). Empty: min(cores - 2, 8). See .env.example.
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-}
      RUST_LOG: ${RUST_LOG:-info}
      # R2 (ADR-R2-1, ADR-R2-25): the git-ignored data dir, read-only. The 3-4-5 Syzygy tables
      # (ADR-R2-12) sit in it; without them the tablebase probe is unavailable and analysis goes
      # on.
      DATA_DIR: /data
      SYZYGY_PATH: /data/syzygy
      # A verified copy of the tables (about 940 MB) is kept in this volume. It is checked at
      # every start and copied only when changed. Every probe re-opens the table set, which is
      # slow through a Windows bind mount (ADR-R2-25).
      SYZYGY_STAGE_DIR: /var/lib/chess-improver/syzygy
      # Maia-2 (ADR-R2-13). Empty: difficulty stays pending_maia (never estimated). The Maia overlay
      # (docker-compose.maia.yml) sets http://maia:8080 and joins its network.
      MAIA_URL: ${MAIA_URL:-}
      # Plan of schedule-analysis jobs that name none: beta (default, ADR 0041), free or pro.
      WORKER_DEFAULT_PLAN: ${WORKER_DEFAULT_PLAN:-}
      # How often each linked account's newest games are fetched (sync-accounts, ADR 0076).
      # Empty: 30 minutes.
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-}
      # R3 AI coaching (ADR 0062). Interactive calls go to the sidecar; the token defaults to the
      # sidecar's own dev default. Without a sidecar credential, reports are computed-only.
      AI_SIDECAR_URL: http://ai-sidecar:7310
      AI_SIDECAR_TOKEN: ${AI_SIDECAR_TOKEN:-dev-only-sidecar-token-change-me-0000000}
      # The chat tool endpoint the sidecar calls back. Never published (no ports:); only the
      # compose network reaches it.
      AI_TOOL_BIND: 0.0.0.0:7311
      AI_TOOL_PUBLIC_URL: http://rust-worker:7311
      # Only the Message Batches client uses the key in Rust (empty: batches off).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Monthly budgets in micro-USD (ADR 0061). Empty: the defaults; the global cap is off.
      AI_BUDGET_FREE_MICRO_USD: ${AI_BUDGET_FREE_MICRO_USD:-}
      AI_BUDGET_PRO_MICRO_USD: ${AI_BUDGET_PRO_MICRO_USD:-}
      AI_GLOBAL_MONTHLY_BUDGET_MICRO_USD: ${AI_GLOBAL_MONTHLY_BUDGET_MICRO_USD:-}
      # The AI plan (ADR 0075), the same variables as the web's. Empty: beta, 100 coach messages
      # a week, 1 manual report a UTC day (1 to 24).
      AI_DEFAULT_PLAN: ${AI_DEFAULT_PLAN:-beta}
      AI_BETA_CHAT_WEEKLY: ${AI_BETA_CHAT_WEEKLY:-100}
      AI_BETA_MANUAL_REPORTS_PER_DAY: ${AI_BETA_MANUAL_REPORTS_PER_DAY:-1}
    volumes:
      - ./data:/data:ro
      # From a worktree, SYZYGY_HOST_DIR points at the main checkout's tables.
      - ${SYZYGY_HOST_DIR:-./data/syzygy}:/data/syzygy:ro
      - syzygy_stage:/var/lib/chess-improver/syzygy
    depends_on:
      postgres:
        condition: service_healthy
      ai-sidecar:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  # Operator data tools (scripts/setup.sh full|data): the worker image's `lichess-db`, with the
  # git-ignored data/ writable. `syzygy --dest /data/syzygy` fetches the verified 3-4-5 tables;
  # `build --month ...` streams a Lichess month into the database (the dump is never stored).
  # Profile `data`, so a plain `up` never starts it.
  data:
    profiles: [data]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    entrypoint: ["lichess-db"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chess
      DATA_DIR: /data
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  syzygy_stage:
  node_modules:
  worker_node_modules:
  web_node_modules:
  web_next:
  chess_core_node_modules:
  db_node_modules:
  ui_node_modules:
  ai_sidecar_node_modules:
  site_node_modules:
  pnpm_store:
  rust_target:
  cargo_registry:
    external: true
    name: ci-cargo-registry
  cargo_git:
    external: true
    name: ci-cargo-git
  sccache:
    external: true
    name: ci-sccache
  crate_age:
    external: true
    name: ci-crate-age
