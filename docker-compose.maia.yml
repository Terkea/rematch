# Maia-2 difficulty service (R2 Task 24, ADR-R2-13), opt-in so plain test projects create one
# network only (Docker's default address pools fit about 30 networks across all projects).
# Use: COMPOSE_FILE=docker-compose.yml:docker-compose.maia.yml docker compose -p <name> --profile maia up -d maia
services:
  rust-dev:
    # maia_internal reaches the Maia service; default keeps Postgres and the internet.
    networks: [default, maia_internal]
  # Maia-2 difficulty service (R2 Task 24, ADR-R2-13). Opt-in: `docker compose --profile maia up -d
  # maia`, then set MAIA_URL=http://maia:8080 for the Rust side. Difficulty comes only from Maia:
  # with MAIA_URL unset or Maia down, positions are recorded as `pending_maia` (never estimated).
  # The service sits only on the internal network: no egress, and no host port here (the host
  # port 127.0.0.1:58080 is opt-in through docker-compose.ports.yml, like Postgres and Redis).
  maia:
    profiles: [maia]
    build:
      context: services/maia
      target: runtime
    environment:
      MAIA_MODEL: ${MAIA_MODEL:-rapid}
    read_only: true
    tmpfs:
      - /tmp
    networks: [maia_internal]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  # No route out: services on it reach each other only (Maia and its clients; the rust-worker
  # joins it when it lands, lane I).
  maia_internal:
    internal: true
