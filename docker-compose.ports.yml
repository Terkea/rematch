# Opt-in host port publishing for the main dev stack. Enabled through COMPOSE_FILE in .env
# (see .env.example). Parallel/CI projects use docker-compose.yml alone, which publishes nothing.
services:
  postgres:
    ports:
      - "127.0.0.1:55432:5432"
  redis:
    ports:
      - "127.0.0.1:56379:6379"
  # Maia (ADR-R2-13). Docker cannot publish a port from an internal-only network, so with this
  # dev-only overlay maia also joins the default network and therefore HAS EGRESS. The beta/prod
  # stack (like parallel and CI projects, docker-compose.yml alone) keeps maia on the internal
  # network only: no host port, no egress.
  maia:
    ports:
      - "127.0.0.1:58080:8080"
    networks: [maia_internal, default]
