# Opt-in host port publishing for the main dev stack. Enabled through COMPOSE_FILE in .env
# (see .env.example). Parallel/CI projects use docker-compose.yml alone, which publishes nothing.
# Each port can move in .env (WEB_PORT, MAILPIT_PORT, POSTGRES_PORT, REDIS_PORT); a moved WEB_PORT
# also moves the web's BETTER_AUTH_URL (docker-compose.yml), so sign-in links follow it.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-48025}:8025"
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
  fakes:
    ports:
      - "127.0.0.1:53199:3199"
