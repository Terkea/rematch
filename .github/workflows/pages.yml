name: Pages

# The public site (site/, ADR 0096): built on every pull request that touches it, built and
# deployed to GitHub Pages on main. No secrets: the deploy uses the OIDC token GitHub Pages issues
# to this workflow. Actions are pinned by commit SHA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@12.21.0
      - name: Install the site's dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @ci/site...
      - name: Build the site
        run: pnpm --filter @ci/site build
      - name: Check the site's links
        run: pnpm --filter @ci/site links
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
