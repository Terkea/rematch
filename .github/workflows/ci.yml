name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/chess_test
      WORKER_DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/chess_worker_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Create the worker test database
        run: psql "postgres://postgres:postgres@localhost:5432/chess_test" -c "CREATE DATABASE chess_worker_test"
      - name: Check npm release age (7 days) and exact pins
        run: node scripts/check-npm-age.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  rust:
    runs-on: ubuntu-latest
    env:
      CONTACT_EMAIL: ci@example.invalid
      LANE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust dev image
        run: docker compose build rust-dev
      # Publish dates never change, so the crates.io answers are cached between runs.
      - uses: actions/cache@v4
        with:
          path: backend/target/crate-age-cache
          key: crate-age-${{ hashFiles('backend/Cargo.lock', 'backend/Dockerfile') }}
          restore-keys: crate-age-
      - name: Crate age (every locked crate and pinned tool at least 7 days old)
        run: >-
          docker compose run --rm --no-deps
          -e CRATE_AGE_CACHE=/work/backend/target/crate-age-cache
          rust-dev sh scripts/check-crate-age.sh
      # --locked everywhere: a Cargo.lock that does not match the manifests fails the build.
      - name: fmt, clippy, cargo-deny and tests
        run: >-
          docker compose run --rm rust-dev sh -c
          "cargo fmt --check
          && cargo clippy --locked --workspace --all-targets -- -D warnings
          && cargo deny --locked check
          && cargo test --locked --workspace"
      - name: Stop the stack
        if: always()
        run: docker compose down -v
  baseline-schema:
    # ADR 0033: the sqlx baseline must produce exactly the schema the Drizzle migrations do.
    # Runs always (cheap), so a change to either side cannot slip past a path filter.
    runs-on: ubuntu-latest
    env:
      CONTACT_EMAIL: ci@example.invalid
      COMPOSE: docker compose -p ci-baseline-schema
    steps:
      - uses: actions/checkout@v4
      - name: Diff the Drizzle and sqlx schemas
        run: sh backend/scripts/check-baseline-schema.sh
      - name: Stop the stack
        if: always()
        run: docker compose -p ci-baseline-schema down -v
