name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/chess_test
      WORKER_DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/chess_worker_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Create the worker test database
        run: psql "postgres://postgres:postgres@localhost:5432/chess_test" -c "CREATE DATABASE chess_worker_test"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  rust:
    runs-on: ubuntu-latest
    env:
      CONTACT_EMAIL: ci@example.invalid
      LANE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust dev image
        run: docker compose build rust-dev
      - name: fmt, clippy, cargo-deny and tests
        run: >-
          docker compose run --rm rust-dev sh -c
          "cargo fmt --check
          && cargo clippy --workspace --all-targets -- -D warnings
          && cargo deny check
          && cargo test --workspace"
      - name: Stop the stack
        if: always()
        run: docker compose down -v
