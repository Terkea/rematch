# Dependency updates (ADR 0095). Weekly, grouped, and never for a release younger than 7 days:
# the same supply-chain rule as scripts/check-npm-age.mjs and scripts/check-crate-age.sh, which
# CI enforces anyway. PR titles are Conventional Commits ("chore(deps): ..."), so the PR-title
# lint passes and release-please leaves them out of the changelog.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # The runtime is Node 22 (.nvmrc, the Dockerfiles), so its types stay on 22. A Node major is
    # a decision with an ADR, made by the maintainer, not a weekly update (ADR 0108).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    labels: [type/chore]
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]

  # Cargo.toml dependency lists and Cargo.lock belong to the maintainer (CLAUDE.md, ADR 0099):
  # these pull requests are reviewed and merged by the maintainer, never by a contributor, after
  # the Rust job (cargo deny, crate age, --locked tests) is green. Majors are not grouped, so each
  # one is its own decision.
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [type/chore, area/rust-backend]
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/worker
      - /backend
      - /services/ai-sidecar
      - /services/maia
    # The same rule for the Node base image: majors are the maintainer's decision (ADR 0108).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [type/chore]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels: [type/chore]
    groups:
      actions:
        patterns: ["*"]
