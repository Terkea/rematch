<figure class="hiw-diagram not-content" aria-labelledby="hiw-caption"><svg viewBox="0 0 400 712" role="img" aria-labelledby="hiw-title hiw-desc"><title id="hiw-title">How Rematch turns a game into advice</title><desc id="hiw-desc">From top to bottom: the chess.com public API, import and sync, the Stockfish 19 pool, enrichment (fed by the Syzygy tables and, optionally, Maia-2), the profile engine (fed by your opponents and, optionally, the Lichess database), the coaching input and the web app. Postgres sits beside every stage. Optionally the coaching input goes to the AI sidecar, and its text reaches the web app only through the validator.</desc><defs><marker id="hiw-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hiw-head" d="M1 1 L9 5 L1 9"/></marker></defs><rect class="hiw-box" x="48" y="16" width="180" height="52" rx="4"/><text class="hiw-name" x="138.0" y="39.0">chess.com public API</text><text class="hiw-sub" x="138.0" y="55.0">monthly archives</text><line class="hiw-line" x1="138.0" y1="68" x2="138.0" y2="98" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="48" y="100" width="180" height="52" rx="4"/><text class="hiw-name" x="138.0" y="123.0">Import and sync</text><text class="hiw-sub" x="138.0" y="139.0">every 30 minutes</text><line class="hiw-line" x1="138.0" y1="152" x2="138.0" y2="182" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="48" y="184" width="180" height="52" rx="4"/><text class="hiw-name" x="138.0" y="207.0">Stockfish 19 pool</text><text class="hiw-sub" x="138.0" y="223.0">300k nodes a position</text><line class="hiw-line" x1="138.0" y1="236" x2="138.0" y2="266" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="48" y="268" width="180" height="108" rx="4"/><text class="hiw-name" x="138.0" y="319.0">Enrichment</text><text class="hiw-sub" x="138.0" y="335.0">MultiPV 3, threat probes,</text><text class="hiw-sub" x="138.0" y="349.0">motif tags</text><line class="hiw-line" x1="138.0" y1="376" x2="138.0" y2="406" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="48" y="408" width="180" height="108" rx="4"/><text class="hiw-name" x="138.0" y="459.0">Profile engine</text><text class="hiw-sub" x="138.0" y="475.0">W1 to W12 per chance,</text><text class="hiw-sub" x="138.0" y="489.0">80% ranges</text><line class="hiw-line" x1="138.0" y1="516" x2="138.0" y2="546" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="48" y="548" width="180" height="52" rx="4"/><text class="hiw-name" x="138.0" y="571.0">Coaching input</text><text class="hiw-sub" x="138.0" y="587.0">a snapshot per build</text><line class="hiw-line" x1="138.0" y1="600" x2="138.0" y2="630" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="48" y="632" width="180" height="68" rx="4"/><text class="hiw-name" x="138.0" y="663.0">Web app</text><text class="hiw-sub" x="138.0" y="679.0">review, profile,</text><text class="hiw-sub" x="138.0" y="693.0">trainer, focus</text><rect class="hiw-rail" x="4" y="100" width="28" height="600" rx="4"/><text class="hiw-rail-text" transform="translate(23 400.0) rotate(-90)">Postgres: the job queue and every fact</text><line class="hiw-tick" x1="32" y1="126.0" x2="48" y2="126.0"/><line class="hiw-tick" x1="32" y1="210.0" x2="48" y2="210.0"/><line class="hiw-tick" x1="32" y1="322.0" x2="48" y2="322.0"/><line class="hiw-tick" x1="32" y1="462.0" x2="48" y2="462.0"/><line class="hiw-tick" x1="32" y1="574.0" x2="48" y2="574.0"/><line class="hiw-tick" x1="32" y1="666.0" x2="48" y2="666.0"/><rect class="hiw-box" x="256" y="272" width="144" height="46" rx="4"/><text class="hiw-name" x="328.0" y="292.0">Syzygy 3-4-5</text><text class="hiw-sub" x="328.0" y="308.0">endgame tables</text><line class="hiw-line" x1="256" y1="295.0" x2="230" y2="295.0" marker-end="url(#hiw-head)"/><rect class="hiw-box hiw-opt" x="256" y="326" width="144" height="46" rx="4"/><text class="hiw-name" x="328.0" y="346.0">Maia-2</text><text class="hiw-sub" x="328.0" y="362.0">how humans play</text><line class="hiw-line hiw-opt" x1="256" y1="349.0" x2="230" y2="349.0" marker-end="url(#hiw-head)"/><rect class="hiw-box" x="256" y="412" width="144" height="46" rx="4"/><text class="hiw-name" x="328.0" y="432.0">Your opponents</text><text class="hiw-sub" x="328.0" y="448.0">the peer rates</text><line class="hiw-line" x1="256" y1="435.0" x2="230" y2="435.0" marker-end="url(#hiw-head)"/><rect class="hiw-box hiw-opt" x="256" y="466" width="144" height="46" rx="4"/><text class="hiw-name" x="328.0" y="486.0">Lichess database</text><text class="hiw-sub" x="328.0" y="502.0">via lichess-db</text><line class="hiw-line hiw-opt" x1="256" y1="489.0" x2="230" y2="489.0" marker-end="url(#hiw-head)"/><rect class="hiw-box hiw-opt" x="256" y="548" width="144" height="52" rx="4"/><text class="hiw-name" x="328.0" y="571.0">AI sidecar</text><text class="hiw-sub" x="328.0" y="587.0">Claude, optional</text><line class="hiw-line hiw-opt" x1="228" y1="574" x2="254" y2="574" marker-end="url(#hiw-head)"/><rect class="hiw-box hiw-opt" x="256" y="640" width="144" height="52" rx="4"/><text class="hiw-name" x="328.0" y="663.0">Validator</text><text class="hiw-sub" x="328.0" y="679.0">drops uncited claims</text><line class="hiw-line hiw-opt" x1="328.0" y1="600" x2="328.0" y2="638" marker-end="url(#hiw-head)"/><line class="hiw-line hiw-opt" x1="256" y1="666" x2="230" y2="666" marker-end="url(#hiw-head)"/></svg><figcaption id="hiw-caption">Solid lines always run. Dotted ones are optional: without Maia, the Lichess builds or an AI key, everything on a solid line still works.</figcaption></figure>
