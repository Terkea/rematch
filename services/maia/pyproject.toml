[project]
name = "ci-maia"
version = "0.1.0"
description = "Maia-2 move-probability service for chess-improver difficulty estimates (ADR-R2-13)."
requires-python = ">=3.12,<3.13"
# Direct dependencies, pinned exactly. The full transitive set is pinned in requirements.lock,
# which the Dockerfile installs with --no-deps. torch comes from the CPU wheel index (2.8.0+cpu).
dependencies = [
    "maia2==0.11.0",
    "torch==2.8.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.11.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
