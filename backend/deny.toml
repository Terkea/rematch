# cargo-deny configuration (ADR 0031). CI runs `cargo deny check`; any violation fails the build.
# Never widen the licence allowlist without an ADR addendum.

[graph]
all-features = false
# We build and ship only x86-64 Linux (the dev, CI and runtime images, and the Stockfish asset).
# Without this, target-specific crates we never compile are checked too, e.g. webpki-root-certs
# (CDLA-Permissive-2.0), which rustls-platform-verifier pulls in only on wasm32.
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
# The allowlist is fixed by the plan; not every licence on it occurs today.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false` and `license = "UNLICENSED"`.
ignore = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono is unmaintained (informational, no vulnerability). sqlx 0.9 and the shared types use it;
  # moving to jiff or time is a separate decision (ADR 0031, "Known exceptions").
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; replacement tracked in ADR 0031" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
