# cargo-deny configuration (ADR 0031). CI runs `cargo deny check`; any violation fails the build.
# Never widen the licence allowlist without an ADR addendum.

[graph]
all-features = false
# Every target we build or deploy MUST be listed here (ADR 0031). Crates that only other targets
# use are not checked, e.g. webpki-root-certs (CDLA-Permissive-2.0), which
# rustls-platform-verifier pulls in only on wasm32.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
# MIT-0 (MIT without the attribution clause) added by ADR-R2-1 addendum: strictly more permissive.
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
# The allowlist is fixed by the plan; not every licence on it occurs today.
unused-allowed-license = "allow"
# cargo-deny skips crates reachable only through dev-dependencies in the licence check unless
# this is set (it defaults to false). Test-only crates (wiremock, jsonschema, ...) are linked
# into test binaries we build and run, so they get the same licence rules (ADR 0031).
# Build-dependencies are already checked, and advisories already cover the whole graph.
include-dev = true

[licenses.private]
# Workspace crates are `publish = false` and `license = "AGPL-3.0-only"` (the project licence);
# the allowlist above governs third-party crates only.
ignore = true

[advisories]
version = 2
yanked = "deny"
# Temporary, dated exception. Remove it by bumping `url` to >=2.5.9 on or after
# 2026-11-27, when 2.5.9 (released 2026-11-20) passes the 7-day crate-age rule.
# RUSTSEC-2026-0592 is a stack overflow in `Url::origin()` on nested `blob:`
# URLs. No crate here calls `Url::origin()` or `url::quirks::origin()` (checked
# with grep); `url` arrives only through reqwest for fixed outbound hosts.
ignore = [
  { id = "RUSTSEC-2026-0592", reason = "Url::origin() unused; bump url to 2.5.9 on or after 2026-11-27 (crate-age rule)" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
